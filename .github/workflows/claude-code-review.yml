name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the review can diff against the base branch
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Log every turn, so a review that posts nothing can be diagnosed
          show_full_output: true
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }},
            base branch `${{ github.event.pull_request.base.ref }}`.

            1. Run `/code-review high origin/${{ github.event.pull_request.base.ref }}...HEAD`.
               If that command is not available, review `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`
               yourself: read each changed function in full, check its callers, and look for wrong
               conditions, off-by-one and boundary values, missing error paths, and tests that do
               not cover the change. Follow CLAUDE.md.
            2. Post each finding as one inline comment on the changed line with
               mcp__github_inline_comment__create_inline_comment: one or two sentences, the
               concrete input that fails, and the fix.
            3. If there are no findings, post a single PR comment with
               `gh pr comment ${{ github.event.pull_request.number }} --body "No issues found."`.

            Do not edit files, commit, push, approve or request changes.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
